<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>תודה על פנייתכם - איינשטיין אתרים</title>
  <meta name="description" content="ההודעה התקבלה בהצלחה.">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css?v=28">
  <style>
    .thanks {
      min-height: calc(100vh - 220px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding-block: clamp(3rem, 8vw, 6rem);
    }
    .thanks h1 { margin-block: 1.4rem 0.6rem; }
    .thanks .lead { color: var(--muted); max-width: 30rem; margin-inline: auto; }
    .thanks .btn { margin-block-start: 2rem; }
    .thanks .direct {
      margin-block-start: 1.6rem;
      font-size: 0.92rem;
      color: var(--muted);
    }
    .thanks .direct a { color: var(--blue); font-weight: 700; text-decoration: none; }
    .thanks .direct a:hover { color: var(--cyan); }

    .check-badge circle,
    .check-badge path {
      stroke-dasharray: 300;
      stroke-dashoffset: 300;
      animation: draw 0.9s ease-out forwards;
    }
    .check-badge path { animation-delay: 0.45s; animation-duration: 0.5s; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .check-badge circle, .check-badge path { animation: none; stroke-dashoffset: 0; }
    }
  </style>
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a class="logo" href="/" aria-label="Einstein Web - דף הבית">
        <img src="/assets/logo.png" alt="Einstein Web Development" height="50">
      </a>
      <div class="nav-actions">
        <a class="btn btn-small" href="/" data-en="Back to home">חזרה לדף הבית</a>
      </div>
    </div>
  </header>

  <main>
    <div class="container thanks">
      <svg class="check-badge" viewBox="0 0 96 96" width="104" height="104" aria-hidden="true">
        <circle cx="48" cy="48" r="43" fill="none" stroke="#1763aa" stroke-width="3.5" stroke-linecap="round" opacity="0.35"/>
        <path d="M31 50 L44 63 L66 37" fill="none" stroke="#01a0c6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1 data-en="Thank you!">תודה על פנייתכם!</h1>
      <p class="lead" data-en="Your message was received. We’ll get back to you within one business day.">ההודעה התקבלה בהצלחה. נחזור אליכם תוך יום עסקים.</p>
      <a class="btn" href="/" data-en="Back to home">חזרה לדף הבית</a>
      <p class="direct">
        <span data-en="In a hurry? Email us directly:">ממהרים? כתבו לנו ישירות:</span>
        <a href="mailto:info@einstein-web.co.il" dir="ltr">info@einstein-web.co.il</a>
      </p>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <img src="/assets/favicon.png" alt="" width="22" height="22">
      <p><span data-en="Einstein Web">איינשטיין אתרים</span> · © 2026 · <span data-en="All rights reserved">כל הזכויות שמורות</span> · <a href="/accessibility.html" style="color:inherit" data-en="Accessibility statement">הצהרת נגישות</a></p>
    </div>
  </footer>

  <script>
    // mirror the visitor's language choice from the main site
    (function () {
      try {
        var lang = new URLSearchParams(location.search).get('lang') ||
                   localStorage.getItem('einstein-web-lang');
        if (lang !== 'en') return;
        document.documentElement.lang = 'en';
        document.documentElement.dir = 'ltr';
        document.title = 'Thank you - Einstein Web';
        document.querySelectorAll('[data-en]').forEach(function (el) {
          el.textContent = el.getAttribute('data-en');
        });
      } catch (e) { /* storage blocked - stay Hebrew */ }
    })();
  </script>
</body>
</html>
